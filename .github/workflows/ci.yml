name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI (Lint, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check backend

      - name: Verify build / byte-compilation
        run: |
          python -m compileall backend/app backend/tests

      - name: Run Pytest
        run: |
          cd backend
          pytest -v

  notification-ci:
    name: Notification Service CI (Lint, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'notification-service/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r notification-service/requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check notification-service

      - name: Verify build / byte-compilation
        run: |
          python -m compileall notification-service/app notification-service/tests

      - name: Run Pytest
        run: |
          cd notification-service
          pytest -v

  frontend-ci:
    name: Frontend CI (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Verify build syntax
        run: npm run build

      - name: Run unit tests
        run: npm test

  docker-build-and-scan:
    name: Docker Build & Vulnerability Scan (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    needs: [backend-ci, notification-ci, frontend-ci]
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: ./backend
            image: taskmanager-backend
          - name: notification
            context: ./notification-service
            image: taskmanager-notification
          - name: frontend
            context: ./frontend
            image: taskmanager-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          load: true
          tags: ${{ matrix.service.image }}:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service.image }}:local
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

  publish-ghcr:
    name: Publish to GHCR (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    needs: [docker-build-and-scan]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: ./backend
            image-name: taskmanager-backend
          - name: notification
            context: ./notification-service
            image-name: taskmanager-notification
          - name: frontend
            context: ./frontend
            image-name: taskmanager-frontend
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image-name }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
