# Приклад маніфесту секрету (НЕ комітити реальні виробничі паролі у публічні гілки)
# У виробничому GitOps секрети управляються через Sealed Secrets або External Secrets Operator.
# Для лабораторної роботи цей секрет створюється безпосередньо в кластері:
# kubectl create secret generic taskmanager-secret -n devops-task-manager \
#   --from-literal=POSTGRES_USER=taskuser \
#   --from-literal=POSTGRES_PASSWORD=taskpass \
#   --from-literal=POSTGRES_DB=taskdb \
#   --from-literal=DATABASE_URL=postgresql://taskuser:taskpass@devops-task-manager-db:5432/taskdb
apiVersion: v1
kind: Secret
metadata:
  name: taskmanager-secret
  namespace: devops-task-manager
  labels:
    app.kubernetes.io/name: devops-task-manager
    app.kubernetes.io/part-of: taskmanager
    mascot: "harbuz"
type: Opaque
stringData:
  POSTGRES_USER: taskuser
  POSTGRES_PASSWORD: taskpass
  POSTGRES_DB: taskdb
  DATABASE_URL: postgresql://taskuser:taskpass@devops-task-manager-db:5432/taskdb
