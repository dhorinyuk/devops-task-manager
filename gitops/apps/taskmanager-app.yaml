apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-task-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: devops-task-manager
    app.kubernetes.io/part-of: taskmanager
spec:
  project: default
  source:
    repoURL: https://github.com/dhorinyuk/devops-task-manager.git
    targetRevision: HEAD
    path: helm
    helm:
      valueFiles:
        - values.yaml
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-task-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
