# API Kubernetes для роботи зі сховищами
apiVersion: v1

# Тип об'єкта — PersistentVolumeClaim
kind: PersistentVolumeClaim

metadata:
  # Назва запиту на сховище
  name: postgres-pvc

  # Namespace, у якому створюється сховище
  namespace: devops-task-manager

  # Мітки для ідентифікації
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    mascot: кабачок

  # Додаткова інформація
  annotations:
    devops-lab/mascot-approved: "true"

spec:
  # Режим доступу до сховища
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      # Запитуємо 1 ГБ постійного сховища
      storage: 1Gi
