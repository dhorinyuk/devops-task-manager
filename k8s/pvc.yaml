apiVersion: v1

kind: PersistentVolumeClaim

metadata:
  name: postgres-pvc

  namespace: devops-task-manager

  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    mascot: kabachok

  annotations:
    devops-lab/mascot-approved: "true"

spec:
  # Режим доступу до сховища
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      # Запитуємо 1 ГБ постійного сховища
      storage: 1Gi
