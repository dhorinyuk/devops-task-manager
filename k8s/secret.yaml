# API Kubernetes для роботи із секретами
apiVersion: v1

# Тип об'єкта — Secret
kind: Secret

metadata:
  # Назва секрету
  name: taskmanager-secret

  # Namespace, у якому створюється секрет
  namespace: devops-task-manager

  # Мітки для ідентифікації та групування
  labels:
    app.kubernetes.io/name: devops-task-manager
    app.kubernetes.io/part-of: taskmanager
    mascot: кабачок

  # Додаткова інформація про об'єкт
  annotations:
    devops-lab/mascot-approved: "true"

# Тип секрету — звичайний Secret
type: Opaque

# Дані секрету у форматі Base64
data:
  # Ім'я користувача PostgreSQL
  POSTGRES_USER: dGFza3VzZXI=

  # Пароль користувача PostgreSQL
  POSTGRES_PASSWORD: dGFza3Bhc3M=

  # Назва бази даних
  POSTGRES_DB: dGFza2Ri

  # Повний рядок підключення до бази даних
  DATABASE_URL: cG9zdGdyZXNxbDovL3Rhc2t1c2VyOnRhc2twYXNzQGRiOjU0MzIvdGFza2Ri
