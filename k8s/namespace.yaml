# API Kubernetes для створення Namespace
apiVersion: v1

# Тип об'єкта — Namespace
kind: Namespace

metadata:
  # Назва простору імен
  name: devops-task-manager

  # Мітки для ідентифікації та групування
  labels:
    name: devops-task-manager
    mascot: кабачок

  # Додаткова інформація про об'єкт
  annotations:
    devops-lab/mascot-approved: "true"
