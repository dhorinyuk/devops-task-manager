# Версія API Kubernetes
apiVersion: v1

# Тип об'єкта — ConfigMap
kind: ConfigMap

metadata:
  # Назва ConfigMap
  name: taskmanager-config

  # Namespace, у якому створюється об'єкт
  namespace: devops-task-manager

  # Мітки для ідентифікації та групування
  labels:
    app.kubernetes.io/name: devops-task-manager
    app.kubernetes.io/part-of: taskmanager
    mascot: кабачок

  # Додаткова інформація про об'єкт
  annotations:
    devops-lab/mascot-approved: "true"

# Звичайні налаштування застосунку
data:
  # Адреса сервісу сповіщень
  NOTIFICATION_URL: "http://notification:8001"

  # Середовище запуску застосунку
  APP_ENV: "production"

  # Рівень деталізації журналів
  LOG_LEVEL: "info"

  # Адреса бази даних
  DB_HOST: "db"

  # Порт бази даних PostgreSQL
  DB_PORT: "5432"

  # Назва бази даних
  DB_NAME: "taskdb"
