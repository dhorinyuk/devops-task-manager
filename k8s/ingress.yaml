apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: taskmanager-ingress
  namespace: devops-task-manager

  labels:
    app.kubernetes.io/name: devops-task-manager
    mascot: kabachok

  annotations:
    devops-lab/mascot-approved: "true"

    # Переписує шлях запиту на /
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:
  # Використовуємо контролер NGINX
  ingressClassName: nginx

  # Правила маршрутизації запитів
  rules:
    # Домен, через який відкривається застосунок
    - host: taskmanager.local
      http:
        paths:

          # Головна сторінка направляється на Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

          # Запити до /api направляються на Backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000

          # Запити до /notifications направляються
          # на сервіс сповіщень
          - path: /notifications
            pathType: Prefix
            backend:
              service:
                name: notification
                port:
                  number: 8001
