[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    # B008: Do not perform function call in argument defaults (standard FastAPI Depends pattern)
    "B008",
]

[tool.ruff.lint.isort]
combine-as-imports = true
