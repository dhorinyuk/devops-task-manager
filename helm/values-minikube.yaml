# DVO-L5 GitOps Values for Minikube
# Оптимізована конфігурація для локального кластера Minikube та Argo CD

# Обов'язкова мітка лабораторної роботи (латиницею для валідації K8s)
mascot: "harbuz"

# Backend сервіс
backend:
  replicaCount: 1
  image:
    repository: ghcr.io/dimahorinyuk/taskmanager-backend
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2

# Frontend сервіс
frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/dimahorinyuk/taskmanager-frontend
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  resources:
    requests:
      cpu: 30m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 64Mi
  probes:
    liveness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
    readiness:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2

# Notification сервіс
notification:
  replicaCount: 1
  image:
    repository: ghcr.io/dimahorinyuk/taskmanager-notification
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 8001
  resources:
    requests:
      cpu: 30m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 64Mi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2

# База даних PostgreSQL
db:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# Конфігурація застосунку
config:
  appEnv: "minikube-gitops"
  logLevel: "info"
  dbHost: ""
  dbPort: "5432"
  dbName: "taskdb"
  notificationUrl: ""

# Безпека секретів за принципом GitOps:
# Секрети не зберігаються у відкритому вигляді в репозиторії Git!
# Використовується патерн existingSecret, створений через захищений канал / bootstrap.
secret:
  existingSecret: "taskmanager-secret"

ingress:
  enabled: false

tests:
  enabled: false

hooks:
  preUpgrade:
    enabled: false
