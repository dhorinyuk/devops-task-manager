# DVO-L4-3C8B52
# Налаштування Helm-чарту для DEVELOPMENT

# Параметри середовища розробки
config:
  appEnv: "development"
  logLevel: "debug"

# Налаштування Backend
backend:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# Налаштування Frontend
frontend:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

# Налаштування сервісу сповіщень
notification:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent

# Політика завантаження образу PostgreSQL
db:
  image:
    pullPolicy: IfNotPresent

# У Dev-середовищі Ingress вимкнений
ingress:
  enabled: false
