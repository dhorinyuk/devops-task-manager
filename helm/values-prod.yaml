# DVO-L4-3C8B52
# Налаштування Helm-чарту для PRODUCTION

# Параметри робочого середовища
config:
  appEnv: "production"
  logLevel: "warn"

# Налаштування Backend
backend:
  replicaCount: 3
  image:
    tag: "1.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# Налаштування Frontend
frontend:
  replicaCount: 2
  image:
    tag: "1.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Налаштування сервісу сповіщень
notification:
  replicaCount: 2
  image:
    tag: "1.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Налаштування PostgreSQL
db:
  image:
    pullPolicy: IfNotPresent
  # Збільшуємо обсяг постійного сховища
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Увімкнення зовнішнього доступу через Ingress
ingress:
  enabled: true
  host: "taskmanager.prod.local"
