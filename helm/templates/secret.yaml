# DVO-L4-3C8B52
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-task-manager.fullname" . }}-secret
  labels:
    {{- include "devops-task-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret
  annotations:
    {{- include "devops-task-manager.annotations" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_USER: {{ .Values.secret.postgresUser | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secret.postgresPassword | b64enc | quote }}
  POSTGRES_DB: {{ .Values.secret.postgresDb | b64enc | quote }}
  {{- $dbHost := default (printf "%s-db" (include "devops-task-manager.fullname" .)) .Values.config.dbHost }}
  {{- $defaultDbUrl := printf "postgresql://%s:%s@%s:%d/%s" .Values.secret.postgresUser .Values.secret.postgresPassword $dbHost (int .Values.config.dbPort) .Values.secret.postgresDb }}
  DATABASE_URL: {{ default $defaultDbUrl .Values.secret.databaseUrl | b64enc | quote }}
