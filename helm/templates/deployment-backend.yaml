# DVO-L4-3C8B52
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devops-task-manager.fullname" . }}-backend
  labels:
    {{- include "devops-task-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    app: backend
  annotations:
    {{- include "devops-task-manager.annotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "devops-task-manager.selectorLabels" . | nindent 6 }}
      app: backend
  template:
    metadata:
      labels:
        {{- include "devops-task-manager.labels" . | nindent 8 }}
        app: backend
      annotations:
        {{- include "devops-task-manager.annotations" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "devops-task-manager.fullname" . }}-secret
                  key: DATABASE_URL
            - name: NOTIFICATION_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "devops-task-manager.fullname" . }}-config
                  key: NOTIFICATION_URL
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "devops-task-manager.fullname" . }}-config
                  key: APP_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "devops-task-manager.fullname" . }}-config
                  key: LOG_LEVEL
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.readiness.timeoutSeconds }}
