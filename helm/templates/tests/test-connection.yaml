# DVO-L4-3C8B52
{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "devops-task-manager.fullname" . }}-test-connection"
  labels:
    {{- include "devops-task-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- include "devops-task-manager.annotations" . | nindent 4 }}
spec:
  containers:
    - name: test-connection
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      command:
        - sh
        - -c
        - |
          echo "Testing Frontend HTTP connection..."
          curl --fail --connect-timeout 5 http://{{ include "devops-task-manager.fullname" . }}-frontend:{{ .Values.frontend.service.port }}
          echo ""
          echo "Testing Backend API /health endpoint..."
          curl --fail --connect-timeout 5 http://{{ include "devops-task-manager.fullname" . }}-backend:{{ .Values.backend.service.port }}/health
          echo ""
          echo "Testing Notification Service /health endpoint..."
          curl --fail --connect-timeout 5 http://{{ include "devops-task-manager.fullname" . }}-notification:{{ .Values.notification.service.port }}/health
          echo ""
          echo "All connection tests passed successfully!"
  restartPolicy: Never
{{- end }}
