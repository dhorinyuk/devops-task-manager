# DVO-L4-3C8B52
# Default values for devops-task-manager (Dev profile)

mascot: "гарбуз"

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/dimahorinyuk/taskmanager-backend
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/dimahorinyuk/taskmanager-frontend
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  probes:
    liveness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
    readiness:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2

notification:
  replicaCount: 1
  image:
    repository: ghcr.io/dimahorinyuk/taskmanager-notification
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 8001
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2

db:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

config:
  appEnv: "development"
  logLevel: "debug"
  dbHost: "" # falls back to {{ fullname }}-db
  dbPort: "5432"
  dbName: "taskdb"
  notificationUrl: "" # falls back to http://{{ fullname }}-notification:8001

secret:
  postgresUser: "taskuser"
  postgresPassword: "taskpass"
  postgresDb: "taskdb"
  databaseUrl: "" # falls back to postgresql://taskuser:taskpass@{{ fullname }}-db:5432/taskdb

ingress:
  enabled: false
  className: "nginx"
  host: "taskmanager.local"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.7.1"
    pullPolicy: IfNotPresent

hooks:
  preUpgrade:
    enabled: true
    image:
      repository: postgres
      tag: "16-alpine"
      pullPolicy: IfNotPresent
